name: Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify origin main commit
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "Deploying commit $(git rev-parse HEAD)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm through Corepack
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check static portal
        run: pnpm check

      - name: Verify deployment approval
        env:
          DEPLOY_APPROVAL_TOKEN: ${{ secrets.SNOW_BASE_DEPLOY_APPROVAL_TOKEN }}
          DEPLOY_APPROVAL_PROJECT: snow-index
          DEPLOY_APPROVAL_TARGET: pages
          DEPLOY_APPROVAL_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_APPROVAL_REQUEST_SOURCE: github-actions
          DEPLOY_APPROVAL_REQUEST_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_APPROVAL_WAIT_SECONDS: "900"
        run: node scripts/verify-deployment-approval.mjs

      - name: Deploy Cloudflare Pages
        run: pnpm exec wrangler pages deploy public --project-name snow-index --branch main --commit-hash "${GITHUB_SHA}" --commit-message "${GITHUB_SHA}" --commit-dirty=false
