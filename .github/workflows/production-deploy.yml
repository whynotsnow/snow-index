name: Production Deploy

run-name: snow-index/pages ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'candidate' }} ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || github.run_id }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "Candidate validation or selected-artifact deployment"
        required: true
        default: verify-only
        type: choice
        options:
          - verify-only
          - candidate
          - selected-artifact
      project_slug:
        description: "Deployment project slug"
        required: true
        default: snow-index
        type: string
      target:
        description: "Deployment target"
        required: true
        default: pages
        type: string
      commit_sha:
        description: "Exact candidate commit SHA"
        required: false
        type: string
      artifact_id:
        description: "snow-base deployment artifact id"
        required: false
        type: string
      artifact_digest:
        description: "Canonical Pages tar digest"
        required: false
        type: string
      artifact_run_id:
        description: "Source candidate GitHub Actions run id"
        required: false
        type: string
      artifact_github_id:
        description: "Source candidate GitHub artifact id"
        required: false
        type: string
      artifact_name:
        description: "Source candidate GitHub artifact name"
        required: false
        type: string
      request_id:
        description: "snow-base deployment request id"
        required: false
        type: string
      change_summary:
        description: "Approved deployment change summary"
        required: false
        type: string
      validation_summary:
        description: "Candidate validation summary"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build Pages candidate
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'candidate' || inputs.mode == 'verify-only'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: write
    env:
      DEPLOY_CANDIDATE_PROJECT: ${{ github.event.inputs.project_slug || 'snow-index' }}
      DEPLOY_CANDIDATE_TARGET: ${{ github.event.inputs.target || 'pages' }}
      DEPLOY_CANDIDATE_COMMIT_SHA: ${{ github.event.inputs.commit_sha || github.sha }}
      DEPLOY_CANDIDATE_REQUEST_ID: ${{ github.event.inputs.request_id || format('push:{0}:{1}:snow-index:pages', github.run_id, github.run_attempt) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - name: Validate candidate dispatch contract
        run: |
          test "$DEPLOY_CANDIDATE_PROJECT" = snow-index
          test "$DEPLOY_CANDIDATE_TARGET" = pages
          test "$DEPLOY_CANDIDATE_COMMIT_SHA" = "$(git rev-parse HEAD)"
          printf '%s' "$DEPLOY_CANDIDATE_REQUEST_ID" | grep -Eq '^[A-Za-z0-9._:-]{1,128}$'

      - name: Check deployment approval contract
        id: contract
        uses: whynotsnow/snow-base-deployment-approval-action@76c3396eaa0635ef8de2c8668b77d939a292cbac
        with:
          operation: contract
          token: ${{ secrets.DEPLOY_APPROVAL_TOKEN }}
          project-slug: snow-index
          target: pages

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup pnpm through Corepack
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report candidate run started
        if: github.event_name == 'push' || inputs.mode == 'candidate'
        uses: whynotsnow/snow-base-deployment-approval-action@76c3396eaa0635ef8de2c8668b77d939a292cbac
        with:
          operation: candidate-callback
          token: ${{ secrets.DEPLOY_APPROVAL_TOKEN }}
          project-slug: ${{ env.DEPLOY_CANDIDATE_PROJECT }}
          target: ${{ env.DEPLOY_CANDIDATE_TARGET }}
          commit-sha: ${{ env.DEPLOY_CANDIDATE_COMMIT_SHA }}
          request-id: ${{ env.DEPLOY_CANDIDATE_REQUEST_ID }}
          github-run-id: ${{ github.run_id }}
          github-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          callback-status: in_progress
          phase: source_validating

      - name: Validate source
        run: pnpm check

      - name: Freeze canonical Pages artifact
        id: freeze
        run: |
          digest="$(node scripts/deployment-artifact.mjs pack --root "$GITHUB_WORKSPACE" --archive "$RUNNER_TEMP/pages-dist.tar.gz")"
          echo "artifact_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload candidate artifact
        id: upload
        if: github.event_name == 'push' || inputs.mode == 'candidate'
        uses: actions/upload-artifact@v4
        with:
          name: snow-index-pages-candidate
          path: ${{ runner.temp }}/pages-dist.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Download candidate artifact for round-trip check
        if: github.event_name == 'push' || inputs.mode == 'candidate'
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/pages-roundtrip

      - name: Recheck canonical digest after artifact round-trip
        id: roundtrip
        if: github.event_name == 'push' || inputs.mode == 'candidate'
        run: |
          digest="$(node scripts/deployment-artifact.mjs verify --archive "$RUNNER_TEMP/pages-roundtrip/pages-dist.tar.gz" --expected-digest "${{ steps.freeze.outputs.artifact_digest }}")"
          echo "artifact_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Calculate candidate expiry
        id: expiry
        if: github.event_name == 'push' || inputs.mode == 'candidate'
        run: echo "expires_at=$(date -u -d '+7 days' '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Register candidate artifact
        id: register
        if: github.event_name == 'push' || inputs.mode == 'candidate'
        uses: whynotsnow/snow-base-deployment-approval-action@76c3396eaa0635ef8de2c8668b77d939a292cbac
        with:
          operation: register-artifact
          token: ${{ secrets.DEPLOY_APPROVAL_TOKEN }}
          project-slug: ${{ env.DEPLOY_CANDIDATE_PROJECT }}
          target: ${{ env.DEPLOY_CANDIDATE_TARGET }}
          commit-sha: ${{ env.DEPLOY_CANDIDATE_COMMIT_SHA }}
          artifact-type: pages-dist
          artifact-digest: ${{ steps.roundtrip.outputs.artifact_digest }}
          storage-provider: github-actions
          storage-key: snow-index-pages-candidate
          artifact-role: candidate
          request-source: github-actions
          request-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          expires-at: ${{ steps.expiry.outputs.expires_at }}
          build-status: succeeded
          validation-status: succeeded
          metadata-json: |
            {
              "githubArtifactId": "${{ steps.upload.outputs.artifact-id }}",
              "githubArtifactRunId": "${{ github.run_id }}",
              "githubArtifactName": "snow-index-pages-candidate",
              "canonicalArchiveName": "pages-dist.tar.gz",
              "artifactUrl": "${{ steps.upload.outputs.artifact-url }}",
              "githubRunUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "retentionDays": 7
            }

      - name: Report candidate run success
        if: github.event_name == 'push' || inputs.mode == 'candidate'
        uses: whynotsnow/snow-base-deployment-approval-action@76c3396eaa0635ef8de2c8668b77d939a292cbac
        with:
          operation: candidate-callback
          token: ${{ secrets.DEPLOY_APPROVAL_TOKEN }}
          project-slug: ${{ env.DEPLOY_CANDIDATE_PROJECT }}
          target: ${{ env.DEPLOY_CANDIDATE_TARGET }}
          commit-sha: ${{ env.DEPLOY_CANDIDATE_COMMIT_SHA }}
          request-id: ${{ env.DEPLOY_CANDIDATE_REQUEST_ID }}
          github-run-id: ${{ github.run_id }}
          github-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          callback-status: completed
          conclusion: success
          phase: artifact_registered
          artifact-id: ${{ steps.register.outputs['artifact-id'] }}
          artifact-digest: ${{ steps.register.outputs['artifact-digest'] }}

      - name: Report candidate run failure
        if: failure() && (github.event_name == 'push' || inputs.mode == 'candidate')
        uses: whynotsnow/snow-base-deployment-approval-action@76c3396eaa0635ef8de2c8668b77d939a292cbac
        with:
          operation: candidate-callback
          token: ${{ secrets.DEPLOY_APPROVAL_TOKEN }}
          project-slug: ${{ env.DEPLOY_CANDIDATE_PROJECT }}
          target: ${{ env.DEPLOY_CANDIDATE_TARGET }}
          commit-sha: ${{ env.DEPLOY_CANDIDATE_COMMIT_SHA }}
          request-id: ${{ env.DEPLOY_CANDIDATE_REQUEST_ID }}
          github-run-id: ${{ github.run_id }}
          github-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          callback-status: completed
          conclusion: failure
          phase: workflow_failed
          error-code: candidate_workflow_failed

  selected-artifact:
    name: Deploy selected Pages artifact
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'selected-artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Validate selected-artifact dispatch contract
        env:
          SELECTED_PROJECT: ${{ inputs.project_slug }}
          SELECTED_TARGET: ${{ inputs.target }}
          SELECTED_COMMIT: ${{ inputs.commit_sha }}
          SELECTED_ARTIFACT_ID: ${{ inputs.artifact_id }}
          SELECTED_DIGEST: ${{ inputs.artifact_digest }}
          SELECTED_RUN_ID: ${{ inputs.artifact_run_id }}
          SELECTED_GITHUB_ID: ${{ inputs.artifact_github_id }}
          SELECTED_NAME: ${{ inputs.artifact_name }}
          SELECTED_REQUEST: ${{ inputs.request_id }}
        run: |
          test "$SELECTED_PROJECT" = snow-index
          test "$SELECTED_TARGET" = pages
          test "$SELECTED_COMMIT" = "$(git rev-parse HEAD)"
          test "$SELECTED_COMMIT" = "$(git rev-parse --verify "$SELECTED_COMMIT^{commit}")"
          test "$SELECTED_ARTIFACT_ID" != ""
          echo "$SELECTED_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "$SELECTED_RUN_ID" -gt 0
          test "$SELECTED_GITHUB_ID" -gt 0
          test "$SELECTED_NAME" = snow-index-pages-candidate
          test "$SELECTED_REQUEST" != ""
          printf '%s' "$SELECTED_REQUEST" | grep -Eq '^[A-Za-z0-9._:-]{1,128}$'

      - name: Check deployment approval contract
        id: contract
        uses: whynotsnow/snow-base-deployment-approval-action@76c3396eaa0635ef8de2c8668b77d939a292cbac
        with:
          operation: contract
          token: ${{ secrets.DEPLOY_APPROVAL_TOKEN }}
          project-slug: snow-index
          target: pages

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup pnpm through Corepack
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report deployment run started
        uses: whynotsnow/snow-base-deployment-approval-action@76c3396eaa0635ef8de2c8668b77d939a292cbac
        with:
          operation: deployment-callback
          token: ${{ secrets.DEPLOY_APPROVAL_TOKEN }}
          project-slug: ${{ inputs.project_slug }}
          target: ${{ inputs.target }}
          commit-sha: ${{ inputs.commit_sha }}
          request-id: ${{ inputs.request_id }}
          artifact-id: ${{ inputs.artifact_id }}
          artifact-digest: ${{ inputs.artifact_digest }}
          github-run-id: ${{ github.run_id }}
          github-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          callback-status: in_progress
          phase: workflow_started

      - name: Check snow-base public API compatibility
        id: api_preflight
        run: node scripts/check-api-compatibility.mjs

      - name: Download selected candidate artifact
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          artifact-ids: ${{ inputs.artifact_github_id }}
          path: ${{ runner.temp }}/pages-selected

      - name: Verify and extract selected canonical payload
        run: |
          node scripts/deployment-artifact.mjs verify \
            --archive "$RUNNER_TEMP/pages-selected/pages-dist.tar.gz" \
            --expected-digest "${{ inputs.artifact_digest }}" \
            --extract-to "$RUNNER_TEMP/pages-payload"

      - name: Request and wait for owner approval
        id: approval_request
        uses: whynotsnow/snow-base-deployment-approval-action@76c3396eaa0635ef8de2c8668b77d939a292cbac
        with:
          operation: request-approval
          token: ${{ secrets.DEPLOY_APPROVAL_TOKEN }}
          project-slug: ${{ inputs.project_slug }}
          target: ${{ inputs.target }}
          commit-sha: ${{ inputs.commit_sha }}
          artifact-id: ${{ inputs.artifact_id }}
          artifact-digest: ${{ inputs.artifact_digest }}
          change-summary: ${{ inputs.change_summary }}
          validation-summary: ${{ steps.api_preflight.outputs.validation_summary || inputs.validation_summary }}
          request-source: github-actions
          request-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          idempotency-key: ${{ inputs.request_id }}

      - name: Wait for owner approval
        id: approval_wait
        uses: whynotsnow/snow-base-deployment-approval-action@76c3396eaa0635ef8de2c8668b77d939a292cbac
        with:
          operation: wait-approval
          token: ${{ secrets.DEPLOY_APPROVAL_TOKEN }}
          project-slug: ${{ inputs.project_slug }}
          target: ${{ inputs.target }}
          commit-sha: ${{ inputs.commit_sha }}
          request-id: ${{ steps.approval_request.outputs['approval-id'] }}
          artifact-id: ${{ inputs.artifact_id }}
          artifact-digest: ${{ inputs.artifact_digest }}
          wait-seconds: "900"
          poll-seconds: "15"

      - name: Consume exact owner approval
        uses: whynotsnow/snow-base-deployment-approval-action@76c3396eaa0635ef8de2c8668b77d939a292cbac
        with:
          operation: consume-approval
          token: ${{ secrets.DEPLOY_APPROVAL_TOKEN }}
          project-slug: ${{ inputs.project_slug }}
          target: ${{ inputs.target }}
          commit-sha: ${{ inputs.commit_sha }}
          approval-id: ${{ steps.approval_wait.outputs['approval-id'] }}
          artifact-id: ${{ inputs.artifact_id }}
          artifact-digest: ${{ inputs.artifact_digest }}

      - name: Deploy verified canonical payload
        working-directory: ${{ runner.temp }}/pages-payload
        run: |
          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" pages deploy public \
            --project-name snow-index \
            --branch main \
            --commit-hash "${{ inputs.commit_sha }}" \
            --commit-message "${{ inputs.commit_sha }}" \
            --commit-dirty=false

      - name: Report deployment run success
        uses: whynotsnow/snow-base-deployment-approval-action@76c3396eaa0635ef8de2c8668b77d939a292cbac
        with:
          operation: deployment-callback
          token: ${{ secrets.DEPLOY_APPROVAL_TOKEN }}
          project-slug: ${{ inputs.project_slug }}
          target: ${{ inputs.target }}
          commit-sha: ${{ inputs.commit_sha }}
          request-id: ${{ inputs.request_id }}
          artifact-id: ${{ inputs.artifact_id }}
          artifact-digest: ${{ inputs.artifact_digest }}
          github-run-id: ${{ github.run_id }}
          github-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          callback-status: completed
          conclusion: success
          phase: pages_deployed

      - name: Report deployment run failure
        if: failure()
        uses: whynotsnow/snow-base-deployment-approval-action@76c3396eaa0635ef8de2c8668b77d939a292cbac
        with:
          operation: deployment-callback
          token: ${{ secrets.DEPLOY_APPROVAL_TOKEN }}
          project-slug: ${{ inputs.project_slug }}
          target: ${{ inputs.target }}
          commit-sha: ${{ inputs.commit_sha }}
          request-id: ${{ inputs.request_id }}
          artifact-id: ${{ inputs.artifact_id }}
          artifact-digest: ${{ inputs.artifact_digest }}
          github-run-id: ${{ github.run_id }}
          github-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          callback-status: completed
          conclusion: failure
          phase: workflow_failed
          error-code: selected_artifact_workflow_failed
